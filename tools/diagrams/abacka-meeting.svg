<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Top view of the Åbacka meeting place: people walk along the path at the top, four groups sit on both sides of the wave-shaped sofa on the deck, two groups facing the path and two facing the water, and one person sits at the edge of the deck by the river" style="width:100%;height:100%;display:block;font-family:var(--font)">
  <defs>
    <pattern id="ab-slats" width="1200" height="14" patternUnits="userSpaceOnUse"><rect width="1200" height="14" fill="#DDC6A2"/><line x1="0" y1="13.5" x2="1200" y2="13.5" stroke="#CDB38B" stroke-width="1"/></pattern>
    <g id="ab-p"><circle r="11" fill="#141414"/></g>
  </defs>
  <rect width="1200" height="800" fill="#F2F1ED"/>

  <!-- slope contours -->
  <g fill="none" stroke="#E3E0D8" stroke-width="2">
    <path d="M0 230 C300 210 900 250 1200 220"/><path d="M0 290 C300 270 900 310 1200 280"/>
  </g>

  <!-- path -->
  <path d="M0 100 C300 78 900 128 1200 96 L1200 176 C900 206 300 156 0 180 Z" fill="#E2DFD7"/>
  <text x="40" y="60" font-size="22" fill="#141414">Walking path</text>
  <text x="40" y="84" font-size="18" fill="#6E6D68">People pass by and can stop</text>
  <!-- walkers -->
  <g fill="#6E6D68"><circle cx="210" cy="132" r="10"/><circle cx="238" cy="138" r="10"/><circle cx="930" cy="150" r="10"/><circle cx="1060" cy="138" r="10"/></g>
  <g fill="none" stroke="#6E6D68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 136 h34 m-9 -7 l9 7 l-9 7"/><path d="M906 150 h-34 m9 -7 l-9 7 l9 7"/><path d="M1036 138 h-34 m9 -7 l-9 7 l9 7"/>
  </g>

  <!-- river -->
  <path d="M0 640 C300 618 800 662 1200 630 L1200 800 L0 800 Z" fill="#D3DCDF"/>
  <g fill="none" stroke="#BCC9CD" stroke-width="2" stroke-linecap="round"><path d="M80 712 q20 -8 40 0 t40 0"/><path d="M420 752 q20 -8 40 0 t40 0"/><path d="M880 724 q20 -8 40 0 t40 0"/></g>
  <text x="1160" y="770" font-size="22" fill="#6E6D68" text-anchor="end">Stångån</text>

  <!-- deck -->
  <path d="M230 330 L960 330 L960 650 C700 662 450 640 230 646 Z" fill="url(#ab-slats)"/>

  <!-- view cones: grey towards the path, amber towards the water -->
  <g opacity=".55">
    <path d="M335 392 L285 300 L405 300 Z" fill="#B9B7B0"/>
    <path d="M675 388 L625 296 L745 296 Z" fill="#B9B7B0"/>
    <path d="M505 498 L455 590 L575 590 Z" fill="#F0CF8E"/>
    <path d="M845 492 L795 584 L915 584 Z" fill="#F0CF8E"/>
    <path d="M610 640 L570 700 L650 700 Z" fill="#F0CF8E"/>
  </g>

  <!-- the wave-shaped sofa, seats on both sides -->
  <path d="M300 445 C390 400 450 470 540 445 S690 405 760 440 S880 470 900 440" fill="none" stroke="#8E8C85" stroke-width="44" stroke-linecap="round"/>
  <path d="M300 445 C390 400 450 470 540 445 S690 405 760 440 S880 470 900 440" fill="none" stroke="#A9A79F" stroke-width="2" stroke-dasharray="2 10"/>

  <!-- four groups: 1 and 3 face the path, 2 and 4 face the water -->
  <g><use href="#ab-p" x="315" y="398"/><use href="#ab-p" x="343" y="392"/><use href="#ab-p" x="371" y="392"/></g>
  <g><use href="#ab-p" x="490" y="494"/><use href="#ab-p" x="520" y="492"/></g>
  <g><use href="#ab-p" x="648" y="392"/><use href="#ab-p" x="676" y="388"/><use href="#ab-p" x="704" y="390"/></g>
  <g><use href="#ab-p" x="830" y="494"/><use href="#ab-p" x="860" y="492"/></g>
  <!-- at the water's edge -->
  <use href="#ab-p" x="610" y="636"/>

  <!-- group numbers -->
  <g font-size="18" fill="#F2F1ED" text-anchor="middle">
    <circle cx="343" cy="350" r="16" fill="#141414"/><text x="343" y="356">1</text>
    <circle cx="505" cy="540" r="16" fill="#141414"/><text x="505" y="546">2</text>
    <circle cx="676" cy="346" r="16" fill="#141414"/><text x="676" y="352">3</text>
    <circle cx="845" cy="540" r="16" fill="#141414"/><text x="845" y="546">4</text>
  </g>

  <!-- labels -->
  <g fill="none" stroke="#141414" stroke-width="1.5"><polyline points="1000,300 960,360 925,420"/><polyline points="640,690 700,740 760,740"/></g>
  <text x="1010" y="292" font-size="22" fill="#141414">Sofa with seats</text>
  <text x="1010" y="318" font-size="22" fill="#141414">on both sides</text>
  <text x="768" y="736" font-size="20" fill="#141414">At the water's edge</text>

  <!-- key -->
  <g font-size="18" fill="#6E6D68">
    <rect x="40" y="390" width="18" height="18" fill="#B9B7B0"/><text x="68" y="405">Facing the path</text>
    <rect x="40" y="422" width="18" height="18" fill="#F0CF8E"/><text x="68" y="437">Facing the water</text>
    <circle cx="49" cy="464" r="9" fill="#141414"/><text x="68" y="470">Sitting</text>
    <circle cx="49" cy="496" r="9" fill="#6E6D68"/><text x="68" y="502">Walking</text>
  </g>
</svg>
