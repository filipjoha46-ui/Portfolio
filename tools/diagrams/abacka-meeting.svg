<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Top view of the Åbacka meeting place: people walk along the path at the top, a long slatted sofa with a backrest down the middle stands on the deck along the path with a smaller lounger beside it, four groups sit on both sides of the sofa, two facing the path and two facing the water, and one person sits at the edge of the deck by the river" style="width:100%;height:100%;display:block;font-family:var(--font)">
  <defs>
    <pattern id="ab-deck" width="1200" height="14" patternUnits="userSpaceOnUse"><rect width="1200" height="14" fill="#DDC6A2"/><line x1="0" y1="13.5" x2="1200" y2="13.5" stroke="#CDB38B" stroke-width="1"/></pattern>
    <pattern id="ab-slat" width="12" height="200" patternUnits="userSpaceOnUse"><rect width="12" height="200" fill="#EFE6D6"/><line x1="11" y1="0" x2="11" y2="200" stroke="#BFAE90" stroke-width="2"/></pattern>
    <g id="ab-p"><circle r="11" fill="#141414"/></g>
  </defs>
  <rect width="1200" height="800" fill="#F2F1ED"/>

  <!-- slope contours -->
  <g fill="none" stroke="#E3E0D8" stroke-width="2"><path d="M0 222 C300 204 900 238 1200 212"/></g>

  <!-- path -->
  <path d="M0 100 C300 78 900 128 1200 96 L1200 176 C900 206 300 156 0 180 Z" fill="#E2DFD7"/>
  <text x="40" y="60" font-size="22" fill="#141414">Walking path</text>
  <text x="40" y="84" font-size="18" fill="#6E6D68">People pass by and can stop</text>
  <g fill="#6E6D68"><circle cx="210" cy="132" r="10"/><circle cx="238" cy="138" r="10"/><circle cx="560" cy="142" r="10"/><circle cx="1060" cy="138" r="10"/></g>
  <g fill="none" stroke="#6E6D68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 136 h34 m-9 -7 l9 7 l-9 7"/><path d="M536 142 h-34 m9 -7 l-9 7 l9 7"/><path d="M1036 138 h-34 m9 -7 l-9 7 l9 7"/>
  </g>

  <!-- pergola over the path, outline only -->
  <path d="M880 70 C930 40 1010 50 1050 80 C1110 90 1140 140 1110 190 C1080 236 990 238 950 214 C890 222 850 180 862 132 C840 110 850 82 880 70 Z" fill="none" stroke="#8E8C85" stroke-width="2" stroke-dasharray="6 7"/>
  <text x="1150" y="262" font-size="18" fill="#6E6D68" text-anchor="end">Pergola</text>

  <!-- river -->
  <path d="M0 640 C300 618 800 662 1200 630 L1200 800 L0 800 Z" fill="#D3DCDF"/>
  <g fill="none" stroke="#BCC9CD" stroke-width="2" stroke-linecap="round"><path d="M80 712 q20 -8 40 0 t40 0"/><path d="M420 752 q20 -8 40 0 t40 0"/><path d="M880 724 q20 -8 40 0 t40 0"/></g>
  <text x="1160" y="770" font-size="22" fill="#6E6D68" text-anchor="end">Stångån</text>

  <!-- deck -->
  <path d="M230 262 L960 262 L960 650 C700 662 450 640 230 646 Z" fill="url(#ab-deck)"/>

  <!-- view cones: grey towards the path, amber towards the water -->
  <g opacity=".55">
    <path d="M500 312 L455 200 L545 200 Z" fill="#B9B7B0"/>
    <path d="M720 312 L675 200 L765 200 Z" fill="#B9B7B0"/>
    <path d="M610 380 L560 500 L660 500 Z" fill="#F0CF8E"/>
    <path d="M830 380 L780 500 L880 500 Z" fill="#F0CF8E"/>
    <path d="M610 640 L570 700 L650 700 Z" fill="#F0CF8E"/>
  </g>

  <!-- long slatted sofa: seats on both sides of a backrest down the middle -->
  <rect x="420" y="286" width="480" height="120" rx="26" fill="url(#ab-slat)" stroke="#BFAE90" stroke-width="2"/>
  <rect x="428" y="336" width="464" height="20" rx="10" fill="#A8977A"/>
  <!-- smaller lounger beside it, backrest at one end -->
  <rect x="262" y="300" width="130" height="90" rx="20" fill="url(#ab-slat)" stroke="#BFAE90" stroke-width="2"/>
  <rect x="262" y="300" width="34" height="90" rx="17" fill="#A8977A"/>

  <!-- four groups: 1 and 3 face the path, 2 and 4 face the water -->
  <g><use href="#ab-p" x="472" y="312"/><use href="#ab-p" x="500" y="310"/><use href="#ab-p" x="528" y="312"/></g>
  <g><use href="#ab-p" x="596" y="382"/><use href="#ab-p" x="624" y="382"/></g>
  <g><use href="#ab-p" x="706" y="312"/><use href="#ab-p" x="734" y="312"/></g>
  <g><use href="#ab-p" x="802" y="382"/><use href="#ab-p" x="830" y="380"/><use href="#ab-p" x="858" y="382"/></g>
  <use href="#ab-p" x="610" y="636"/>

  <!-- group numbers -->
  <g font-size="18" fill="#F2F1ED" text-anchor="middle">
    <circle cx="500" cy="236" r="16" fill="#141414"/><text x="500" y="242">1</text>
    <circle cx="610" cy="450" r="16" fill="#141414"/><text x="610" y="456">2</text>
    <circle cx="720" cy="236" r="16" fill="#141414"/><text x="720" y="242">3</text>
    <circle cx="830" cy="450" r="16" fill="#141414"/><text x="830" y="456">4</text>
  </g>

  <!-- labels -->
  <g fill="none" stroke="#141414" stroke-width="1.5"><polyline points="1000,420 940,380 900,360"/><polyline points="300,470 310,400"/><polyline points="640,690 700,740 760,740"/></g>
  <text x="1006" y="420" font-size="22" fill="#141414">Sofa with seats</text>
  <text x="1006" y="446" font-size="22" fill="#141414">on both sides</text>
  <text x="250" y="496" font-size="20" fill="#141414">Lounger</text>
  <text x="768" y="736" font-size="20" fill="#141414">At the water's edge</text>

  <!-- key -->
  <g font-size="18" fill="#6E6D68">
    <rect x="40" y="540" width="18" height="18" fill="#B9B7B0"/><text x="68" y="555">Facing the path</text>
    <rect x="40" y="572" width="18" height="18" fill="#F0CF8E"/><text x="68" y="587">Facing the water</text>
  </g>
</svg>
