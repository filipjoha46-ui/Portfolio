<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section diagram of Celina showing how light leaves the lamp: a fabric diffuser softens the GX53 source, light passes through the open top of the inner vase and falls down onto the table, while the ribbed outer glass glows softly" style="width:100%;height:100%;display:block;font-family:var(--font)">
  <defs>
    <clipPath id="cl-outer"><path d="M310 330 C302 400 302 450 314 510 C326 570 326 630 314 690 C302 750 302 810 312 860 L688 860 C698 810 698 750 686 690 C674 630 674 570 686 510 C698 450 698 400 690 330 Z"/></clipPath>
    <clipPath id="cl-inner"><rect x="428" y="540" width="144" height="170" rx="6"/></clipPath>
    <linearGradient id="cl-metal" x1="0" x2="1"><stop offset="0" stop-color="#B9B7B0"/><stop offset=".45" stop-color="#E6E4DE"/><stop offset="1" stop-color="#A9A79F"/></linearGradient>
    <linearGradient id="cl-beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0A93B" stop-opacity=".75"/><stop offset="1" stop-color="#F0A93B" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="#F2F1ED"/>

  <!-- downward light through the inner vase -->
  <path d="M440 352 L560 352 L630 945 L370 945 Z" fill="url(#cl-beam)" opacity=".55"/>
  <g stroke="#F0A93B" stroke-width="3" stroke-linecap="round" opacity=".8">
    <line x1="455" y1="360" x2="395" y2="925"/><line x1="472" y1="360" x2="445" y2="925"/>
    <line x1="490" y1="360" x2="485" y2="925"/><line x1="510" y1="360" x2="515" y2="925"/>
    <line x1="528" y1="360" x2="555" y2="925"/><line x1="545" y1="360" x2="605" y2="925"/>
  </g>

  <!-- outer Lina vase, clear and ribbed -->
  <g clip-path="url(#cl-outer)">
    <rect x="300" y="320" width="400" height="560" fill="#FFFFFF" opacity=".45"/>
    <g stroke="#C9C7C0" stroke-width="2">
      <line x1="322" y1="320" x2="322" y2="870"/><line x1="340" y1="320" x2="340" y2="870"/><line x1="358" y1="320" x2="358" y2="870"/><line x1="376" y1="320" x2="376" y2="870"/><line x1="394" y1="320" x2="394" y2="870"/>
      <line x1="606" y1="320" x2="606" y2="870"/><line x1="624" y1="320" x2="624" y2="870"/><line x1="642" y1="320" x2="642" y2="870"/><line x1="660" y1="320" x2="660" y2="870"/><line x1="678" y1="320" x2="678" y2="870"/>
    </g>
  </g>
  <path d="M310 330 C302 400 302 450 314 510 C326 570 326 630 314 690 C302 750 302 810 312 860 M690 330 C698 400 698 450 686 510 C674 570 674 630 686 690 C698 750 698 810 688 860" fill="none" stroke="#8E8C85" stroke-width="2.5"/>
  <ellipse cx="500" cy="860" rx="188" ry="14" fill="none" stroke="#B9B7B0" stroke-width="2"/>

  <!-- soft ambient glow through the ribbed glass -->
  <g stroke="#F0A93B" stroke-width="12" stroke-linecap="round" fill="none" opacity=".28">
    <path d="M268 420 q-28 6 -52 0"/><path d="M262 500 q-30 6 -56 0"/><path d="M270 580 q-30 6 -56 0"/><path d="M268 660 q-30 6 -56 0"/><path d="M262 740 q-30 6 -56 0"/><path d="M268 820 q-28 6 -52 0"/>
    <path d="M738 500 q30 6 56 0"/><path d="M730 580 q30 6 56 0"/><path d="M732 660 q30 6 56 0"/><path d="M738 740 q30 6 56 0"/><path d="M732 820 q28 6 52 0"/>
  </g>

  <!-- metal wires holding the inner vase -->
  <g stroke="#6E6D68" stroke-width="1.5"><line x1="372" y1="338" x2="432" y2="544"/><line x1="628" y1="338" x2="568" y2="544"/></g>

  <!-- coloured inner vase, top cut off -->
  <rect x="428" y="540" width="144" height="170" rx="6" fill="#4C74C4" opacity=".62"/>
  <g clip-path="url(#cl-inner)" stroke="#2F57A8" stroke-width="2" opacity=".6">
    <line x1="446" y1="540" x2="446" y2="710"/><line x1="464" y1="540" x2="464" y2="710"/><line x1="482" y1="540" x2="482" y2="710"/><line x1="500" y1="540" x2="500" y2="710"/><line x1="518" y1="540" x2="518" y2="710"/><line x1="536" y1="540" x2="536" y2="710"/><line x1="554" y1="540" x2="554" y2="710"/>
  </g>
  <ellipse cx="500" cy="541" rx="72" ry="9" fill="#F7D9A6" stroke="#2F57A8" stroke-width="2"/>

  <!-- pipe, top cap, lock ring, GX53 puck and diffuser -->
  <rect x="492" y="0" width="16" height="250" fill="url(#cl-metal)"/>
  <rect x="404" y="248" width="192" height="72" rx="4" fill="url(#cl-metal)"/>
  <rect x="362" y="318" width="276" height="20" rx="3" fill="url(#cl-metal)"/>
  <rect x="432" y="300" width="136" height="30" rx="5" fill="#FFFFFF" stroke="#C9C7C0" stroke-width="2"/>
  <line x1="412" y1="352" x2="588" y2="352" stroke="#141414" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>

  <!-- labels -->
  <g fill="none" stroke="#141414" stroke-width="1.5">
    <polyline points="590,352 700,250 735,250"/>
    <polyline points="572,560 735,470"/>
    <polyline points="306,385 262,300 30,300"/>
  </g>
  <g fill="#141414"><circle cx="590" cy="352" r="5"/><circle cx="572" cy="560" r="5"/><circle cx="306" cy="385" r="5"/></g>
  <g font-size="25" fill="#141414" letter-spacing="-0.2">
    <text x="745" y="243">Fabric diffuser</text>
    <text x="745" y="463">Inner vase</text>
    <text x="30" y="226">Ribbed outer glass</text>
  </g>
  <g font-size="21" fill="#6E6D68">
    <text x="745" y="272">Softens the source</text><text x="745" y="298">and prevents glare</text>
    <text x="745" y="492">Top cut off to let</text><text x="745" y="518">light through</text>
    <text x="30" y="255">Soft, glare-free</text><text x="30" y="281">ambient glow</text>
  </g>
  <text x="500" y="990" font-size="21" fill="#6E6D68" text-anchor="middle">Stronger light directed down onto the table</text>
</svg>
